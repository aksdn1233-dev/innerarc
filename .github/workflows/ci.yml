name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit
      - run: pnpm run generate:sbom
      - uses: actions/upload-artifact@v7
        with:
          name: innerarc-cyclonedx-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --project=chromium --project=mobile
