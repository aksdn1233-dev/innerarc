name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # image-size 2.0.3 is listed as patched by the advisories but is not published
      # in npm yet. D-060 defines this narrow, expiring exception.
      #
      # A found vulnerability fails the build. npm's advisory endpoint being unreachable
      # does not: on 2026-09-04 registry.npmjs.org answered in 90ms while
      # /-/npm/v1/security/advisories/bulk timed out for everyone, which blocked the
      # pipeline twice over something no commit here can fix. Three attempts, then the run
      # continues with a loud notice — the audit is a gate on this code, not on npm's
      # uptime. Every other outcome still fails.
      - name: Audit dependencies
        run: |
          # The step's shell runs with -e, which would abort on the first failed attempt
          # before the outcome could be told apart from an outage.
          set +e -u -o pipefail
          for attempt in 1 2 3; do
            # pnpm11 --ignore is a configuration mutation, not the audit gate.
            # The two approved exceptions already live in pnpm-workspace.yaml.
            output=$(pnpm audit 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then exit 0; fi
            case "$output" in
              *TimeoutError*|*ETIMEDOUT*|*ECONNRESET*|*ENOTFOUND*|*EAI_AGAIN*|*"socket hang up"*)
                echo "::warning::Attempt ${attempt}: npm's advisory endpoint is unreachable."
                sleep 30
                ;;
              *)
                echo "::error::pnpm audit reported findings."
                exit "$status"
                ;;
            esac
          done
          echo "::warning::pnpm audit skipped: npm's advisory endpoint was unreachable for three attempts."

      - run: pnpm run generate:sbom
      - uses: actions/upload-artifact@v7
        with:
          name: innerarc-cyclonedx-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --project=chromium --project=mobile --workers=4 --reporter=line
      - name: Verify checkout UI with isolated fake provider shell
        run: pnpm test:e2e tests/e2e/payments.spec.ts --project=chromium --project=mobile --workers=1 --reporter=line
        env:
          E2E_PAYMENT_CHECKOUT: "1"

  space-browser:
    # Functional/asset/geometry gates and current captures on a separate runner.
    # Linux-generated pictures are review artifacts, not automatic premium visual approval.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-space, iphone-space, android-space]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACE_ENABLED: "true"
      SPACE_AI_ENABLED: "false"
      PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/space-browser-results-${{ matrix.project }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test -c playwright.space.config.ts --project=${{ matrix.project }} --workers=1 --update-snapshots=all --reporter=line,json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: space-browser-evidence-${{ matrix.project }}
          path: |
            artifacts/space-browser-results-${{ matrix.project }}.json
            tests/visual/snapshots
            test-results
          if-no-files-found: error
          retention-days: 14
