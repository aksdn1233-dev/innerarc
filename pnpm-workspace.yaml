packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  brace-expansion: "5.0.8"
  "next>sharp": "0.35.3"
  "next>postcss": "8.5.19"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  # vinext 0.0.50 reads `.searchParamsObject` from collectAppPageSearchParams, which
  # returns `.pageSearchParams`. Every page therefore received undefined query
  # parameters, which 404'd every guest report link. Remove when vinext fixes it.
  vinext@0.0.50: patches/vinext@0.0.50.patch
