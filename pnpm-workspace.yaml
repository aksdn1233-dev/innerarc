packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # braces stack-exhaustion DoS: no patched release is published yet (3.0.3 is the
    # latest). Reached only through eslint-config-next and vinext's build-time globbing,
    # never in the deployed Worker. Remove this entry once braces >=3.0.4 exists.
    - GHSA-vfj7-8cjw-p6xm

# Every pin here answers a published advisory in the build, lint, or local-development
# toolchain. None of these packages runs in the deployed Worker. A pin that was current
# when it was written goes stale the moment the next advisory lands — `pnpm audit` in CI
# is what catches that, so these versions are expected to move.
overrides:
  # GHSA for DoS via unbounded intermediate arrays; 5.0.12 covers the subsequent recursion and quadratic-time advisories.
  brace-expansion: "5.0.12"
  # GHSA-wq5f-xc86-pv6w (librsvg CVE-2026-96889), fixed in 0.35.5.
  sharp: "0.35.5"
  # GHSA-68fv-2mgg-jv7q, event-loop DoS through indexed source maps; fixed in 1.2.2.
  source-map-js: "1.2.2"
  # Attacker-controlled sourceMappingURL reads arbitrary .map files when `from` is
  # unset. Scoped to every path rather than `next>postcss` alone, because the same
  # vulnerable copy also arrives through vinext > @unpic/react > next.
  postcss: "8.5.23"
  # Host confusion via a backslash authority introducer, reached through webpack's
  # schema validation inside @vitejs/plugin-rsc.
  # Follow-up canonicalization advisories require 3.1.8.
  fast-uri: "3.1.8"
  # GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh, fixed in 4.3.2. Reached only through eslint and its configs, so
  # it runs while linting and never in the deployed Worker.
  js-yaml: "4.3.2"
  # GHSA-jr45-8vmc-qm54 and GHSA-v3r7-h72x-cjcm, the newer advisory requires 7.29.1. Reached only
  # through wrangler and @cloudflare/vite-plugin by way of miniflare, so it never runs
  # in the deployed Worker, which uses the Cloudflare runtime's own fetch. Pinned inside
  # the 7.x line because that is what miniflare expects; 8.x is a major bump.
  undici: "7.29.1"
  # Zero/negative and custom-generator size infinite loops reached through PostCSS
  # tooling (GHSA-2v37-7h3g-55p8). 3.3.18 is the patched 3.x release.
  nanoid: "3.3.18"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  vinext@0.0.50: patches/vinext@0.0.50.patch
