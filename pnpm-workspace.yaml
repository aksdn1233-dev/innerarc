packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
  minimumReleaseAge: -1

# Every pin here answers a published advisory in the build, lint, or local-development
# toolchain. None of these packages runs in the deployed Worker. A pin that was current
# when it was written goes stale the moment the next advisory lands — `pnpm audit` in CI
# is what catches that, so these versions are expected to move.
overrides:
  brace-expansion: "5.0.12"
  sharp: "0.35.4"
  postcss: "8.5.23"
  fast-uri: "3.1.8"
  js-yaml: "4.3.2"
  undici: "7.29.1"
  nanoid: "3.3.18"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  vinext@0.0.50: patches/vinext@0.0.50.patch
